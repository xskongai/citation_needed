[project]
name = "citation-needed"
version = "0.13.1"
description = "End-to-end single-citation audit: extraction, resolution, acquisition, parsing, evidence retrieval, judgement, source assessment, and reliability"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "openai>=3.5,<4",
  "pymupdf>=1.26,<2",
  "beautifulsoup4>=4.12,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["citation_needed*"]
exclude = ["data*", "examples*", "scripts*", "tests*"]
