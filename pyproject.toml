[project]
name = "citation-needed"
version = "0.14.1"
description = "Hardened real-world single-citation audit with conservative Crossref reference enrichment"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "openai>=3.5,<4",
  "pymupdf>=1.26,<2",
  "beautifulsoup4>=4.12,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["citation_needed*"]
exclude = ["data*", "examples*", "scripts*", "tests*"]
