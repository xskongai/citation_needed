[project]
name = "citation-needed"
version = "0.12.0"
description = "Traceable citation audit with source parsing, guarded acquisition, evidence retrieval, bibliography resolution, relation judgement, source assessment, and reliability policy"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "openai>=3.5,<4",
  "pymupdf>=1.26,<2",
  "beautifulsoup4>=4.12,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
